<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book appointment</title>
</head>
<body>
  {% csrf_token %}
  <a href="/doctors/">&larr; Back to doctors</a>
  <h1 id="doctor-name">Doctor</h1>

  <label for="date">Date:</label>
  <input type="date" id="date">

  <h3>Free slots</h3>
  <div id="slots">Pick a date.</div>
  <p id="selected"></p>

  <label for="reason">Reason (optional):</label><br>
  <input type="text" id="reason" maxlength="300"><br>
  <button type="button" id="book-btn" disabled>Book appointment</button>
  <p id="message"></p>

  <script>
    const doctorId = {{ doctor_id }};
    const dateInput = document.getElementById("date");
    const slotsBox = document.getElementById("slots");
    const selectedText = document.getElementById("selected");
    const reasonInput = document.getElementById("reason");
    const bookBtn = document.getElementById("book-btn");
    const message = document.getElementById("message");
    let selectedTime = null;

    dateInput.min = new Date().toLocaleDateString("en-CA");

    function errorText(data) {
      if (data.detail) return data.detail;
      return Object.values(data).flat().join(" ");
    }

    async function loadDoctor() {
      const response = await fetch("/api/doctors/" + doctorId + "/");
      if (!response.ok) return;
      const doctor = await response.json();
      document.getElementById("doctor-name").textContent =
        doctor.name + " (" + doctor.specialty + ")";
    }

    async function loadSlots() {
      selectedText.textContent = "";
      selectedTime = null;
      bookBtn.disabled = true;

      if (!dateInput.value) {
        slotsBox.textContent = "Pick a date.";
        return;
      }

      const response = await fetch(
        "/api/doctors/" + doctorId + "/slots/?date=" + dateInput.value
      );
      const data = await response.json();

      if (!response.ok) {
        slotsBox.textContent = data.detail || "Could not load slots.";
        return;
      }

      slotsBox.textContent = "";
      if (data.slots.length === 0) {
        slotsBox.textContent = "No free slots on this day.";
        return;
      }

      for (const time of data.slots) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = time;
        button.addEventListener("click", () => {
          selectedTime = time;
          selectedText.textContent = "Selected: " + dateInput.value + " at " + time;
          bookBtn.disabled = false;
        });
        slotsBox.append(button);
      }
    }

    bookBtn.addEventListener("click", async () => {
      const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;

      const response = await fetch("/api/appointments/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrfToken,
        },
        body: JSON.stringify({
          doctor: doctorId,
          date: dateInput.value,
          time: selectedTime,
          reason: reasonInput.value,
        }),
      });
      const data = await response.json();

      if (!response.ok) {
        message.textContent = errorText(data);
      } else {
        message.textContent =
          "Booked: " + data.date + " at " + data.time + " (status: " + data.status + ")";
      }
      await loadSlots();
    });

    dateInput.addEventListener("change", () => {
      message.textContent = "";
      loadSlots();
    });
    loadDoctor();
  </script>
</body>
</html>
