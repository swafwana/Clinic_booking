{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="fa-solid fa-hospital-user"></i>
      </div>
      <h1>Clinic Login</h1>
      <p class="auth-subtitle">Welcome back! Sign in to access your dashboard</p>
    </div>

    <form id="login-form" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="username"><i class="fa-regular fa-user"></i> Username</label>
        <input type="text" id="username" placeholder="Enter username" required autofocus autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Log in
      </button>

      <p id="error" class="auth-error"></p>
    </form>

    <div class="demo-accounts">
      <div class="demo-title">
        <i class="fa-solid fa-circle-info"></i> Quick Demo Logins
      </div>
      <div class="demo-chips">
        <span class="demo-chip" onclick="fillDemo('rahul')"><i class="fa-solid fa-user"></i> Patient: rahul</span>
        <span class="demo-chip" onclick="fillDemo('dr_sharma')"><i class="fa-solid fa-user-doctor"></i> Doctor: dr_sharma</span>
        <span class="demo-chip" onclick="fillDemo('admin')"><i class="fa-solid fa-shield-halved"></i> Admin: admin</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
  <script>
    function fillDemo(username) {
      document.getElementById("username").value = username;
      document.getElementById("password").focus();
    }

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.style.display = "none";
      errorEl.textContent = "";

      const csrfToken = form.querySelector("[name=csrfmiddlewaretoken]").value;

      const response = await fetch("/api/auth/login/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrfToken,
        },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });

      const data = await response.json();

      if (!response.ok) {
        errorEl.textContent = data.detail || "Login failed. Please check your username and password.";
        errorEl.style.display = "block";
        return;
      }

      const redirects = {
        patient: "/doctors/",
        doctor: "/doctor/schedule/",
        admin: "/dashboard/",
      };
      window.location.href = redirects[data.role];
    });
  </script>
{% endblock %}
