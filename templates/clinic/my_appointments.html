{% extends "base.html" %}
{% block title %}My appointments{% endblock %}

{% block content %}
  <div class="page-header">
    <h1><i class="fa-solid fa-calendar-check"></i> My Appointments</h1>
    <p>Track your upcoming doctor visits, review consultation history, and manage bookings.</p>
  </div>

  <div id="message" class="toast-message"></div>

  <div id="appointments" class="appointments-grid">
    <div class="empty-state"><i class="fa-solid fa-spinner fa-spin empty-state-icon"></i><p>Loading your appointments...</p></div>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    const box = document.getElementById("appointments");
    const message = document.getElementById("message");

    async function cancelAppointment(id) {
      if (!confirm("Are you sure you want to cancel this appointment?")) return;

      const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
      const response = await fetch("/api/appointments/" + id + "/cancel/", {
        method: "POST",
        headers: { "X-CSRFToken": csrfToken },
      });

      if (!response.ok) {
        const data = await response.json();
        message.innerHTML = `<div class="alert alert-danger"><i class="fa-solid fa-circle-exclamation"></i> ${data.detail || "Could not cancel."}</div>`;
      } else {
        message.innerHTML = `<div class="alert alert-success"><i class="fa-solid fa-circle-check"></i> Appointment has been cancelled.</div>`;
      }
      await loadAppointments();
    }

    async function loadAppointments() {
      const response = await fetch("/api/appointments/");
      if (!response.ok) {
        box.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation empty-state-icon"></i><p>Could not load appointments.</p></div>`;
        return;
      }

      const appointments = await response.json();
      box.innerHTML = "";

      if (appointments.length === 0) {
        box.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon"><i class="fa-regular fa-calendar-xmark"></i></div>
            <h3>No Appointments Yet</h3>
            <p>You do not have any scheduled appointments with our doctors.</p>
            <a href="/doctors/" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Find a Doctor & Book</a>
          </div>
        `;
        return;
      }

      for (const appt of appointments) {
        const card = document.createElement("div");
        card.className = "appointment-card";

        // Status badge class
        const statusClass = "status-" + (appt.status || "booked");

        // Header: Doctor name + Status
        const header = document.createElement("div");
        header.className = "appointment-card-header";

        const title = document.createElement("div");
        title.className = "appointment-doctor-name";
        title.innerHTML = `<i class="fa-solid fa-user-doctor"></i> ${appt.doctor_name}`;

        const badge = document.createElement("span");
        badge.className = `status-badge ${statusClass}`;
        badge.textContent = appt.status.replace("_", "-");

        header.append(title, badge);

        // Meta info (Date and Time)
        const meta = document.createElement("div");
        meta.className = "appointment-meta";

        const dateRow = document.createElement("div");
        dateRow.className = "appointment-meta-row";
        dateRow.innerHTML = `<i class="fa-regular fa-calendar"></i> <span><strong>Date:</strong> ${appt.date}</span>`;

        const timeRow = document.createElement("div");
        timeRow.className = "appointment-meta-row";
        timeRow.innerHTML = `<i class="fa-regular fa-clock"></i> <span><strong>Time:</strong> ${appt.time.slice(0, 5)}</span>`;

        meta.append(dateRow, timeRow);

        // Reason
        const reasonBox = document.createElement("div");
        reasonBox.className = "appointment-reason";
        reasonBox.innerHTML = `<strong>Reason:</strong> ${appt.reason ? appt.reason : "General Consultation"}`;

        card.append(header, meta, reasonBox);

        // Actions
        if (appt.status === "booked") {
          const startsAt = new Date(appt.date + "T" + appt.time);
          if (startsAt > new Date()) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "btn btn-danger-soft btn-sm";
            button.innerHTML = `<i class="fa-regular fa-circle-xmark"></i> Cancel Appointment`;
            button.addEventListener("click", () => cancelAppointment(appt.id));
            card.append(button);
          } else {
            const note = document.createElement("div");
            note.className = "past-note";
            note.innerHTML = `<i class="fa-regular fa-clock"></i> Past appointment - awaiting doctor confirmation`;
            card.append(note);
          }
        }

        box.append(card);
      }
    }

    loadAppointments();
  </script>
{% endblock %}
